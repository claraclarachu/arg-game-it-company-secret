<!doctype html>
<html lang="zh-TW" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e1e1e" />
  <title>Code & Conspiracy — ARG</title>
  <link rel="manifest" href="/manifest.json" />
  <script type="module" crossorigin src="/assets/main-DbvnJzpP.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/main-gS22Llyo.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <span class="topbar__title">Code & Conspiracy</span>
        <span class="topbar__subtitle">編程人生模擬 · 離線 ARG</span>
      </div>
      <div class="topbar__right">
        <span id="clock" class="badge">--:--:--</span>
        <span class="badge">offline · localStorage</span>
      </div>
    </header>

    <main class="viewport">
      <section id="view-vscode" class="view active" aria-label="VS Code"></section>
      <section id="view-jira" class="view" aria-label="Jira"></section>
      <section id="view-whatsapp" class="view" aria-label="WhatsApp"></section>
      <section id="view-search" class="view" aria-label="Search"></section>
    </main>

    <nav id="dock" class="dock" aria-label="App dock"></nav>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <dialog id="settingsDialog" style="border:1px solid var(--border);border-radius:12px;padding:0;max-width:520px;width:90%">
    <div style="padding:16px">
      <h3 style="margin:0 0 12px">設定</h3>
      <div style="display:grid;gap:10px">
        <label>主題
          <select id="settingTheme" class="select"><option value="dark">Dark</option><option value="light">Light</option></select>
        </label>
        <label>語言
          <select id="settingLang" class="select"><option value="zh-TW">繁中</option><option value="en">English</option></select>
        </label>
        <div class="small muted">遊玩時長: <span id="settingPlaytime">0s</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button id="btnExport" class="btn">匯出存檔</button>
          <label class="btn" style="cursor:pointer">匯入存檔 <input id="btnImport" type="file" accept=".json" hidden /></label>
          <button id="btnReset" class="btn" style="color:var(--error)">重置進度</button>
        </div>
      </div>
      <div style="text-align:right;margin-top:12px"><button class="btn primary" onclick="this.closest('dialog').close()">關閉</button></div>
    </div>
  </dialog>

  <dialog id="notebookDialog" style="border:1px solid var(--border);border-radius:12px;padding:0;max-width:640px;width:90%;max-height:80vh;overflow:auto">
    <div style="padding:16px">
      <h3 style="margin:0 0 12px">筆記本 · 證據板</h3>
      <div id="notebookContent"></div>
      <div style="text-align:right;margin-top:12px"><button class="btn primary" onclick="this.closest('dialog').close()">關閉</button></div>
    </div>
  </dialog>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}));
    }
  </script>
</body>
</html>
