<!doctype html>
<html lang="zh-TW" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0078d4" />
  <title>Code & Conspiracy — ARG</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="stylesheet" href="/assets/css/themes.css" />
  <link rel="stylesheet" href="/assets/css/vscode.css" />
  <link rel="stylesheet" href="/assets/css/jira.css" />
  <link rel="stylesheet" href="/assets/css/whatsapp.css" />
  <link rel="stylesheet" href="/assets/css/search.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />
</head>
<body>
  <div class="app">
    <!-- Windows 11 desktop wallpaper area -->
    <main class="viewport">
      <section id="view-vscode" class="view active" aria-label="VS Code"></section>
      <section id="view-jira" class="view" aria-label="Jira"></section>
      <section id="view-whatsapp" class="view" aria-label="WhatsApp"></section>
      <section id="view-search" class="view" aria-label="Search"></section>
    </main>

    <!-- Windows 11 Taskbar -->
    <nav id="dock" class="taskbar" aria-label="Windows Taskbar"></nav>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <dialog id="settingsDialog" style="background:var(--bg-secondary);color:var(--fg-primary);border:1px solid var(--border);border-radius:12px;padding:0;max-width:520px;width:90%">
    <div style="padding:16px">
      <h3 style="margin:0 0 12px">設定</h3>
      <div style="display:grid;gap:10px">
        <label>主題
          <select id="settingTheme" class="select"><option value="dark">Dark</option><option value="light">Light</option></select>
        </label>
        <div class="small muted">遊玩時長: <span id="settingPlaytime">0s</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button id="btnExport" class="btn">匯出存檔</button>
          <label class="btn" style="cursor:pointer">匯入存檔 <input id="btnImport" type="file" accept=".json" hidden /></label>
          <button id="btnReset" class="btn" style="color:var(--error)">重置進度</button>
        </div>
        <details style="margin-top:8px;border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--bg-primary)">
          <summary style="cursor:pointer;font-weight:600;font-size:13px">鍵盤快捷鍵映射</summary>
          <div style="margin-top:8px;display:grid;gap:4px;font-size:12px;color:var(--fg-secondary)">
            <div><span class="badge">Ctrl+P</span> 快速開啟檔案（Quick Open）</div>
            <div><span class="badge">Ctrl+Shift+F</span> 全域搜尋（Search）</div>
            <div><span class="badge">Ctrl+Shift+G</span> 原始碼控管（Source Control）</div>
            <div><span class="badge">Ctrl+Shift+D</span> 執行與偵錯</div>
            <div><span class="badge">Ctrl+/</span> 聚焦終端機</div>
            <div><span class="badge">Tab</span> 終端機補全 · <span class="badge">↑↓</span> 歷史</div>
            <div class="small muted">提示：於編輯器按 <span class="badge">Help</span> 亦可查看</div>
          </div>
        </details>
      </div>
      <div style="text-align:right;margin-top:12px"><button class="btn primary" onclick="this.closest('dialog').close()">關閉</button></div>
    </div>
  </dialog>

  <dialog id="notebookDialog" style="background:var(--bg-secondary);color:var(--fg-primary);border:1px solid var(--border);border-radius:12px;padding:0;max-width:640px;width:90%;max-height:80vh;overflow:auto">
    <div style="padding:16px">
      <h3 style="margin:0 0 12px">筆記本 · 證據板</h3>
      <div id="notebookContent"></div>
      <div style="text-align:right;margin-top:12px"><button class="btn primary" onclick="this.closest('dialog').close()">關閉</button></div>
    </div>
  </dialog>

  <script type="module" src="/assets/js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}));
    }
  </script>
</body>
</html>
